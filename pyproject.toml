[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flipfill-cad"
version = "0.1.0"
description = "Clearance-first inverse-fill enclosure generation from positioned CAD objects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "FlipFill CAD Contributors" }]
keywords = ["cad", "step", "enclosure", "cadquery", "opencascade", "3d-printing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cadquery==2.8.0",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "trimesh>=4.11.4,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-bdd>=7,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "pyinstaller>=6.13,<7",
]

[project.scripts]
flipfill = "flipfill.cli:run"

[project.gui-scripts]
flipfill-gui = "flipfill.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: line length is handled by the formatter, not worth failing CI over.
# RUF001: the CLI/GUI deliberately use "∪ − ×" in the inverse-fill equation
# and dimension strings for readability; not a bug to flag.
ignore = ["E501", "RUF001"]

[tool.mypy]
# numpy's bundled stubs use 3.12+ typing syntax (PEP 695 `type` statements);
# this only affects how mypy parses installed stubs, not the runtime
# versions flipfill supports (3.11-3.13, see requires-python above).
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["flipfill"]

[[tool.mypy.overrides]]
# The OpenCascade Python bindings ship no type stubs or py.typed marker.
module = ["OCP", "OCP.*", "cadquery_ocp", "cadquery_ocp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# casadi (a hard dependency of cadquery's assembly solver, never imported
# by flipfill directly) ships a generated .pyi with a duplicate-parameter
# bug that is a mypy *parse* error, not a semantic one, so per-module
# ignore_errors cannot suppress it: as of mypy 1.20 + casadi 3.8.0 this
# blocks `mypy src/flipfill` entirely regardless of follow_imports/
# ignore_errors settings. Tracked upstream; not wired into CI until fixed.
# Once resolved, run `mypy src/flipfill` and add it to .github/workflows/ci.yml.
module = ["casadi", "casadi.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.coverage.run]
source = ["flipfill"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
