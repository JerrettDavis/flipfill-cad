[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flipfill-cad"
version = "0.1.0"
description = "Clearance-first inverse-fill enclosure generation from positioned CAD objects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "FlipFill CAD Contributors" }]
keywords = ["cad", "step", "enclosure", "cadquery", "opencascade", "3d-printing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cadquery==2.8.0",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "trimesh>=4.11.4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pyinstaller>=6.13,<7",
]

[project.scripts]
flipfill = "flipfill.cli:main"

[project.gui-scripts]
flipfill-gui = "flipfill.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["flipfill"]

[tool.coverage.run]
source = ["flipfill"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
