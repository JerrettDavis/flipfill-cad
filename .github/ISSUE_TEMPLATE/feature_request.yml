name: Feature request
description: Propose a new capability, command, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you unable to do today, and how are you working around it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A CLI command, GUI interaction, or geometry behavior you'd expect.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - GUI
        - Geometry engine (envelope, clearance, split, generate)
        - Import/export
        - Documentation
        - Packaging/release
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
