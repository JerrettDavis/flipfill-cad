name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov=flipfill --cov-report=term-missing --cov-report=xml
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov=flipfill --cov-report=term-missing --cov-report=xml
      - run: python -m ruff check src tests examples
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
      - name: GUI startup smoke test
        if: runner.os == 'Linux'
        run: timeout 10s xvfb-run -a python -m flipfill gui || test $? -eq 124

  build:
    name: package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Bootstrap and build the Windows package
        if: runner.os == 'Windows'
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/build_windows.ps1
        shell: pwsh
      - name: Bootstrap and build the Linux package
        if: runner.os == 'Linux'
        run: |
          bash scripts/bootstrap.sh
          bash scripts/build_linux.sh
      - name: Verify the console entry point runs from the built package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="dist/FlipFillCAD/FlipFillCAD.exe"
          else
            EXE="dist/FlipFillCAD/FlipFillCAD"
          fi
          test -f "$EXE"
          echo "Built $EXE ($(du -h "$EXE" | cut -f1))"
      - uses: actions/upload-artifact@v4
        with:
          name: flipfill-cad-${{ runner.os }}
          path: dist/FlipFillCAD
          retention-days: 14
