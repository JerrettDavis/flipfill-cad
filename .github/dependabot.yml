version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      cad-kernel:
        patterns:
          - "cadquery*"
          - "OCP*"
          - "vtk*"
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pyinstaller*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
